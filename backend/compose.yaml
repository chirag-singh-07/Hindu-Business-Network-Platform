services:
  mongo:
    image: mongo:8.0
    container_name: hbn-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-hbn_local}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-hbn_local_only}
      MONGO_INITDB_DATABASE: hbn_dev
    ports:
      - "27017:27017"
    volumes:
      - hbn-mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet "mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@127.0.0.1:27017/admin?authSource=admin"
          --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]}).ok }'
          | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
volumes:
  hbn-mongo-data:
